; 측정용 기본 설정. 값의 근거는 docs/01-protocol.md 3장에 있다.
; 여기 있는 값을 바꾸면 그 이전에 뽑은 결과는 폐기 대상이다.

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/Maps/BenchMap
EditorStartupMap=/Game/Maps/BenchMap

[/Script/Engine.RendererSettings]
; 렌더링은 최대한 눌러서 게임 스레드가 병목이 되게 한다. GPU가 프레임을 잡으면
; 우리가 재려는 게임 스레드 신호가 프레임 시간에서 보이지 않는다.
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.Shadow.Virtual.Enable=0
r.RayTracing=False
r.GenerateMeshDistanceFields=False
r.AntiAliasingMethod=0
r.AllowStaticLighting=False

; 프레임마다 상태가 변하는 후처리를 끈다. 켜두면 같은 장면인데 프레임마다 값이 흔들린다.
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.Bloom=False
r.DefaultFeature.AmbientOcclusion=False
r.DefaultFeature.AmbientOcclusionStaticFraction=False

; Substrate는 머티리얼과 GBuffer 동작을 바꾼다. 콘텐츠가 0인 지금 끄는 쪽으로 정했고,
; 켜기로 바꾸려면 결과를 폐기하고 다시 돌린다. env.json에 상태를 기록한다.
r.Substrate=False

; 셰이더 컴파일 대상. 스키닝 경로 항목을 나중에 볼 여지를 남겨둔다.
r.SkinCache.CompileShaders=True

[SystemSettings]
; 러너가 시작할 때 코드로도 한 번 더 적용한다. ini에만 기대지 않는다.
t.MaxFPS=0
r.VSync=0
r.ScreenPercentage=100
r.DynamicRes.OperationMode=0
gc.CollectGarbageEveryFrame=0

; 스케일러빌리티 고정. 언리얼이 첫 실행 때 하드웨어 벤치마크를 돌려
; Saved/Config/.../GameUserSettings.ini에 쓰는 값을 덮는다. Saved/는 저장소에
; 올라가지 않으므로 이걸 박아두지 않으면 머신마다 렌더 설정이 달라진다.
sg.ViewDistanceQuality=3
sg.AntiAliasingQuality=3
sg.PostProcessQuality=3
sg.ShadowQuality=3
sg.GlobalIlluminationQuality=3
sg.ReflectionQuality=3
sg.TextureQuality=3
sg.EffectsQuality=3
sg.FoliageQuality=3
sg.ShadingQuality=3

